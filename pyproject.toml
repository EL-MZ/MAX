[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-morph"
version = "0.1.0"
description = "JAX Morph density approximation and bridge-sampling evidence estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.35", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.11", "ruff>=0.8"]
benchmark = ["scipy>=1.11", "matplotlib>=3.8", "corner>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
