name: Block distribution benchmarks

on:
  push:
    branches: ['codex/block-benchmarks-*']
    paths:
      - 'benchmarks/**'
      - 'src/jax_morph/**'
      - 'tests/test_benchmark_distributions.py'
      - 'pyproject.toml'
      - '.github/workflows/block-benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: block-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      JAX_ENABLE_X64: 'true'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned CPU benchmark dependencies
        run: >-
          python -m pip install -e '.[test,benchmark]'
          'jax[cpu]==0.4.35' 'numpy==2.1.3' 'scipy==1.14.1'
          'matplotlib==3.9.2' 'corner==2.2.3' 'pytest==8.3.3' 'ruff==0.8.6'
      - name: Format benchmark additions
        run: |
          ruff format benchmarks/block_suite.py benchmarks/distributions.py tests/test_benchmark_distributions.py
          ruff check --fix benchmarks/block_suite.py benchmarks/distributions.py tests/test_benchmark_distributions.py
          ruff format benchmarks/block_suite.py benchmarks/distributions.py tests/test_benchmark_distributions.py
      - name: Save formatted benchmark code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks tests/test_benchmark_distributions.py
          git diff --cached --quiet || git commit -m 'Format benchmark sources [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Validate code and analytic targets
        run: |
          ruff check .
          ruff format --check .
          pytest -q
      - name: Run block, density, and speed suite
        run: python -m benchmarks.block_suite --output benchmark-results/blocks-2026-10-05
      - name: Preserve benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-benchmark-results
          path: benchmark-results/blocks-2026-10-05
      - name: Commit and push measured results and images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks tests/test_benchmark_distributions.py benchmark-results/blocks-2026-10-05
          git diff --cached --quiet || git commit -m 'Save measured block benchmarks, KL estimates, and corner plots [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
