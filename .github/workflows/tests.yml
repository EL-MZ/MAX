name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            jax: 'jax[cpu]==0.4.35'
          - python: '3.12'
            jax: 'jax[cpu]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[test]' '${{ matrix.jax }}'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python examples/gaussian_evidence.py
      - run: python benchmarks/sgm.py --dimension 30 --seeds 64 --output benchmark_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: sgm-benchmark-${{ matrix.python }}
          path: benchmark_results.json
